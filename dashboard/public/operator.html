<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sentinel — Operator Console</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0a0a0f; color: #e0e0e0; padding: 1.5rem; }
    h1 { font-size: 1.3rem; color: #8b5cf6; margin-bottom: 1rem; }
    h2 { font-size: 1rem; color: #6366f1; margin-bottom: 0.5rem; }
    .grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1rem; }
    .panel { background: #141420; border: 1px solid #2a2a3a; border-radius: 8px; padding: 1rem; }
    label { display: block; font-size: 0.8rem; color: #888; margin-bottom: 0.3rem; }
    input, textarea, select { width: 100%; background: #1a1a2e; border: 1px solid #333; color: #e0e0e0; padding: 0.5rem; border-radius: 4px; font-size: 0.9rem; margin-bottom: 0.5rem; }
    textarea { resize: vertical; min-height: 60px; }
    button { background: #6366f1; color: white; border: none; padding: 0.6rem 1.2rem; border-radius: 4px; cursor: pointer; font-size: 0.9rem; width: 100%; }
    button:hover { background: #5558e6; }
    button:active { background: #4448d0; }
    .btn-gaia { background: #8b5cf6; }
    .btn-gaia:hover { background: #7c4fe6; }
    .btn-broadcast { background: #f59e0b; color: #000; }
    .btn-broadcast:hover { background: #e69008; }
    .result { margin-top: 0.5rem; font-size: 0.8rem; color: #4ade80; min-height: 1.5rem; }
    .result.error { color: #f87171; }
    #log { margin-top: 1rem; background: #141420; border: 1px solid #2a2a3a; border-radius: 8px; padding: 1rem; max-height: 300px; overflow-y: auto; font-size: 0.8rem; font-family: monospace; }
    .log-entry { margin-bottom: 0.3rem; padding: 0.2rem 0; border-bottom: 1px solid #1a1a2e; }
    .log-time { color: #666; }
  </style>
</head>
<body>
  <h1>Sentinel Operator Console</h1>
  <div class="grid">
    <div class="panel">
      <h2>Besucher-Chat</h2>
      <label>Raum</label>
      <select id="chat-room">
        <option value="buero-ceo">buero-ceo</option>
        <option value="buero-design">buero-design</option>
        <option value="buero-dev-1" selected>buero-dev-1</option>
        <option value="buero-pm">buero-pm</option>
        <option value="buero-sales">buero-sales</option>
        <option value="kueche-eg">kueche-eg</option>
        <option value="konferenz-1">konferenz-1</option>
        <option value="empfang">empfang</option>
      </select>
      <label>Name</label>
      <input type="text" id="chat-sender" value="Kunde" placeholder="Kunde, Besucher, ...">
      <label>Nachricht</label>
      <textarea id="chat-message" placeholder="Guten Tag, wir haetten gerne eine Webpage..."></textarea>
      <button onclick="sendChat()">Senden</button>
      <div class="result" id="chat-result"></div>
    </div>

    <div class="panel">
      <h2>Voice of Gaia</h2>
      <label>Agent-ID (1-60)</label>
      <input type="number" id="gaia-agent" value="1" min="1" max="60">
      <label>Gedanke einpflanzen</label>
      <textarea id="gaia-thought" placeholder="Du solltest Sarah nach dem Aurora-Projekt fragen..."></textarea>
      <button class="btn-gaia" onclick="sendGaia()">Gedanke einpflanzen</button>
      <div class="result" id="gaia-result"></div>
    </div>

    <div class="panel">
      <h2>Broadcast / Durchsage</h2>
      <label>Typ</label>
      <select id="broadcast-type">
        <option value="info">Info</option>
        <option value="announcement">Announcement</option>
        <option value="alert">Alert</option>
      </select>
      <label>Nachricht</label>
      <textarea id="broadcast-message" placeholder="Mittagspause in 10 Minuten..."></textarea>
      <button class="btn-broadcast" onclick="sendBroadcast()">Durchsage senden</button>
      <div class="result" id="broadcast-result"></div>
    </div>
  </div>

  <div id="log"><div style="color:#666">Operator-Log...</div></div>

  <script>
    function addLog(msg) {
      const log = document.getElementById('log');
      const entry = document.createElement('div');
      entry.className = 'log-entry';
      const time = new Date().toLocaleTimeString();
      const timeSpan = document.createElement('span');
      timeSpan.className = 'log-time';
      timeSpan.textContent = time + ' ';
      entry.appendChild(timeSpan);
      const textNode = document.createTextNode(msg);
      entry.appendChild(textNode);
      log.prepend(entry);
    }

    async function apiPost(path, body, resultId) {
      const el = document.getElementById(resultId);
      el.textContent = 'Sende...';
      el.className = 'result';
      try {
        const resp = await fetch('/api/' + path, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        const data = await resp.json();
        if (resp.ok && data.accepted) {
          el.textContent = data.message || 'OK';
          addLog('[' + path + '] ' + (data.message || 'OK'));
        } else {
          el.textContent = data.error || data.message || 'Fehler';
          el.className = 'result error';
          addLog('[' + path + '] FEHLER: ' + (data.error || data.message || resp.status));
        }
      } catch (e) {
        el.textContent = 'Verbindung fehlgeschlagen';
        el.className = 'result error';
        addLog('[' + path + '] FEHLER: ' + e.message);
      }
    }

    function sendChat() {
      apiPost('operator/chat', {
        room_id: document.getElementById('chat-room').value,
        message: document.getElementById('chat-message').value,
        sender_name: document.getElementById('chat-sender').value
      }, 'chat-result');
    }

    function sendGaia() {
      apiPost('operator/gaia', {
        target_agent_id: parseInt(document.getElementById('gaia-agent').value),
        thought: document.getElementById('gaia-thought').value
      }, 'gaia-result');
    }

    function sendBroadcast() {
      apiPost('operator/broadcast', {
        message: document.getElementById('broadcast-message').value,
        type: document.getElementById('broadcast-type').value
      }, 'broadcast-result');
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Sentinel - Dashboard</title>
  <link rel="icon" type="image/png" href="/public/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;700;800&family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/public/css/style.css">
</head>
<body>
  <header>
    <h1>Project Sentinel</h1>
    <nav id="main-nav">
      <button class="nav-btn active" data-view="agents">Agents</button>
      <button class="nav-btn" data-view="floorplan">Bueroplan</button>
      <button class="nav-btn" data-view="activity">Aktivitaet</button>
      <button class="nav-btn" data-view="chaos">Chaos</button>
      <button class="nav-btn" data-view="chat">Chat</button>
      <button class="nav-btn" data-view="metrics">Metriken</button>
      <button class="nav-btn" data-view="cockpit">Cockpit</button>
      <button class="nav-btn" data-view="control">Control</button>
    </nav>
    <div id="projection-lag">Lag: --</div>
    <div id="connection-status">Verbinde...</div>
  </header>
  <main>
    <section id="view-agents" class="view active"></section>
    <section id="view-floorplan" class="view"></section>
    <section id="view-activity" class="view"></section>
    <section id="view-chaos" class="view"></section>
    <section id="view-chat" class="view"></section>
    <section id="view-metrics" class="view"></section>
    <section id="view-cockpit" class="view"></section>
    <section id="view-control" class="view"></section>
  </main>
  <script type="module" src="/public/js/app.js"></script>
</body>
</html>

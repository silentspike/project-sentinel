# Sentinel 10-minute demo stack.
#
# Brings up: NATS + sentinel-daemon + cortex-gateway + sentinel-judge +
#            sentinel-nats-bridge + sentinel-projection + Sentinel console
#
# All five Sentinel services share the same image (deploy/docker/Dockerfile.demo)
# and select their binary via the SENTINEL_ROLE environment variable.
#
# Usage:
#   ./scripts/demo.sh                    # build + run + open console + tear down
#   docker compose -f docker-compose.demo.yml up --build
#
# Ports exposed on the host (every Sentinel-app port uses a +10000 offset
# to avoid colliding with common local dev services on 8000-8090):
#   18001  Console UI             (browser)              -> shared gateway namespace :8001
#   18080  Cortex Gateway (proxy) -- also serves /metrics-> container :8080
#   18082  sentinel-judge        (health, /metrics)     -> container :8082
#   18083  sentinel-nats-bridge  (health)               -> container :8083
#   18084  sentinel-daemon (operator API)               -> container :8084
#    8222  NATS monitoring HTTP                          (no collision risk)
#    4222  NATS client                                   (no collision risk)
#
# Adjust to canonical ports (8001, 8080-8084) if your machine has them free.

name: sentinel-demo

services:
  nats:
    image: nats:2.10-alpine
    container_name: sentinel-demo-nats
    command: ["-c", "/etc/nats/nats.conf"]
    volumes:
      - ./config/demo/nats.conf:/etc/nats/nats.conf:ro
    ports:
      - "4222:4222"
      - "8222:8222"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [sentinel]

  daemon:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.demo
    image: sentinel-demo:local
    container_name: sentinel-demo-daemon
    environment:
      SENTINEL_ROLE: daemon
      CORTEX_GATEWAY_URL: http://gateway:8080
      SENTINEL_AGENT_RUNTIME_CREDENTIAL_FILE: /run/secrets/caller-agent-runtime
      SENTINEL_PLATFORM_CREDENTIAL_FILE: /run/secrets/caller-platform
      SENTINEL_EVOLUTION_CREDENTIAL_FILE: /run/secrets/caller-evolution
      SENTINEL_LLM_USAGE_V2_ENABLED: "false"
    secrets:
      - source: caller-agent-runtime
        uid: "65001"
        gid: "65001"
        mode: 0400
      - source: caller-platform
        uid: "65001"
        gid: "65001"
        mode: 0400
      - source: caller-evolution
        uid: "65001"
        gid: "65001"
        mode: 0400
    depends_on:
      nats:
        condition: service_healthy
    ports:
      - "18084:8084"
    volumes:
      - sentinel-data:/opt/sentinel/data
    healthcheck:
      # operator API has no dedicated /healthz; any HTTP response (incl. 404)
      # proves the listener is up. -f is intentionally omitted.
      test: ["CMD", "curl", "-s", "-o", "/dev/null", "--max-time", "3", "http://localhost:8084/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [sentinel]

  gateway:
    image: sentinel-demo:local
    container_name: sentinel-demo-gateway
    environment:
      SENTINEL_ROLE: gateway
      CORTEX_PRIMARY_PROVIDER: local-loop
      CORTEX_LOCAL_LOOP: "1"
      CORTEX_PROXY_BIND: 0.0.0.0
      # The unauthenticated control plane remains loopback-only and is not published.
      CORTEX_CONTROL_BIND: 127.0.0.1
      CORTEX_AGENT_RUNTIME_CREDENTIAL_FILE: /run/secrets/caller-agent-runtime
      CORTEX_PLATFORM_CREDENTIAL_FILE: /run/secrets/caller-platform
      CORTEX_EVOLUTION_CREDENTIAL_FILE: /run/secrets/caller-evolution
      CORTEX_JUDGE_CREDENTIAL_FILE: /run/secrets/caller-judge
      SENTINEL_CORTEX_CONFIG: /opt/sentinel/config-default/cortex-gateway.toml
    secrets:
      - source: caller-agent-runtime
        uid: "65001"
        gid: "65001"
        mode: 0400
      - source: caller-platform
        uid: "65001"
        gid: "65001"
        mode: 0400
      - source: caller-evolution
        uid: "65001"
        gid: "65001"
        mode: 0400
      - source: caller-judge
        uid: "65001"
        gid: "65001"
        mode: 0400
    depends_on:
      daemon:
        condition: service_healthy
    # The proxy is published on 8080 (also serves /metrics). The control plane
    # remains loopback-only. The console sidecar shares this network namespace
    # so it can retain control-plane functionality without exposing port 8081.
    ports:
      - "18080:8080"
      - "18001:8001/tcp"
      - "18001:8001/udp"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "3", "http://localhost:8080/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks: [sentinel]

  judge:
    image: sentinel-demo:local
    container_name: sentinel-demo-judge
    environment:
      SENTINEL_ROLE: judge
      SENTINEL_JUDGE_CREDENTIAL_FILE: /run/secrets/caller-judge
    secrets:
      - source: caller-judge
        uid: "65001"
        gid: "65001"
        mode: 0400
    depends_on:
      nats:
        condition: service_healthy
      gateway:
        condition: service_healthy
    # host port 18082 to avoid colliding with other local services on 8082
    ports:
      - "18082:8082"
    networks: [sentinel]

  nats-bridge:
    image: sentinel-demo:local
    container_name: sentinel-demo-nats-bridge
    environment:
      SENTINEL_ROLE: nats-bridge
    depends_on:
      nats:
        condition: service_healthy
      daemon:
        condition: service_healthy
    # host port 18083 (matching judge's 18082 offset)
    ports:
      - "18083:8083"
    volumes:
      - sentinel-data:/opt/sentinel/data
    networks: [sentinel]

  projection:
    # CQRS read-model worker. Polls the EventStore and builds the
    # projection.db that the console backend reads (agent_live_view,
    # room_live_view, kpi_1m). Without this service running, the console
    # starts degraded.
    # startup because projection.db doesn't exist.
    image: sentinel-demo:local
    container_name: sentinel-demo-projection
    environment:
      SENTINEL_ROLE: projection
    depends_on:
      daemon:
        condition: service_healthy
    volumes:
      - sentinel-data:/opt/sentinel/data
    networks: [sentinel]

  console:
    image: sentinel-demo:local
    container_name: sentinel-demo-console
    network_mode: "service:gateway"
    environment:
      SENTINEL_ROLE: console
      SENTINEL_DASHBOARD_HTTP_BIND: "0.0.0.0:8001"
      SENTINEL_DASHBOARD_WT_BIND: "0.0.0.0:8001"
      SENTINEL_DASHBOARD_API_KEY: "demo"
      SENTINEL_NATS_URL: "nats://nats:4222"
      SENTINEL_OPERATOR_API_URL: "http://daemon:8084"
      CORTEX_GATEWAY_PROXY_URL: "http://127.0.0.1:8080"
      CORTEX_GATEWAY_CONTROL_URL: "http://127.0.0.1:8081"
    depends_on:
      gateway:
        condition: service_healthy
      projection:
        condition: service_started
    volumes:
      - sentinel-data:/opt/sentinel/data:ro

networks:
  sentinel:
    name: sentinel-demo

volumes:
  sentinel-data:
    name: sentinel-demo-data

secrets:
  caller-agent-runtime:
    external: true
  caller-platform:
    external: true
  caller-evolution:
    external: true
  caller-judge:
    external: true

# examples/minimal-sandbox-policy.toml
#
# Minimal per-agent sandbox policy. Mirrors the production defaults that
# `crates/sentinel-sandbox/src/{cgroups.rs,bwrap.rs,landlock.rs}` apply
# when an agent is spawned. Copy + adapt for your workload.
#
# Use-case: one agent process, one sandbox stack (bwrap + Landlock + cgroups
# v2 + a full-cage network namespace). Drop into config/ next to an agent TOML to override
# per-agent. See the SandboxEnforcer
# (`crates/sentinel-sandbox/src/enforcer.rs`) for how these fields are
# applied at boot.
#
# Pre-conditions on the host:
#   - Linux kernel >= 5.13 (Landlock)
#   - cgroups v2 mounted at /sys/fs/cgroup
#   - bubblewrap installed (`bwrap --version`)
#   - User namespaces enabled (`sysctl kernel.unprivileged_userns_clone`)
#
# Expected outcome: agent process runs with FS reads restricted to
# `read_paths`, FS writes restricted to `write_paths`, exec restricted to
# `exec_paths`, CPU capped to one core, memory capped to 256 MB, fork
# bomb prevented at 50 PIDs, and network restricted to an isolated
# loopback-only namespace.

[bwrap]
hostname        = "sentinel-agent"
share_net       = false   # netns isolation; set true only for ops-debug
die_with_parent = true    # bwrap exits if daemon exits
proc_mount      = "/proc" # TOGAF default
dev_mount       = "/dev"  # TOGAF default

# Read-only binds (host -> guest path)
readonly_binds = [
  ["/usr",     "/usr"],   # system binaries (exec_paths target)
  ["/lib",     "/lib"],   # shared libs
  ["/lib64",   "/lib64"], # shared libs
]

# Writable binds (host -> guest path)
writable_binds = [
  ["/var/sentinel/agents/${AGENT_ID}", "/home/agent"], # per-agent home
]

# Tmpfs mounts (in-guest only)
tmpfs = ["/tmp", "/run"]

[landlock]
# Filesystem read access — kernel-level enforcement.
read_paths = ["/usr", "/lib", "/lib64", "/home/agent"]

# Filesystem write access. Note: Landlock grants `all_access` on
# `write_paths`, INCLUDING execute. The bwrap mount namespace is the
# defense-in-depth layer that prevents executable reach into /tmp.
# See FS-003 in docs/security-test-report.md.
write_paths = ["/home/agent", "/tmp"]

# Filesystem execute access — system binaries only.
exec_paths = ["/usr/bin", "/usr/local/bin"]

[cgroups]
# CPU: 100% of one core (cpu_quota_us / cpu_period_us = 100000/100000)
cpu_quota_us  = 100000
cpu_period_us = 100000

# Memory: 256 MB hard cap. Hitting it triggers OOM-kill (SIGKILL,
# exit 137). See RES-001 in docs/security-test-report.md.
memory_bytes = 268435456   # 256 * 1024 * 1024

# Fork bomb prevention. fork(2) above this limit returns EAGAIN.
# See RES-002 in docs/security-test-report.md.
pids_max = 50

# I/O throttling.
io_max_iops = 300
io_max_bps  = 10485760     # 10 * 1024 * 1024 = 10 MB/s

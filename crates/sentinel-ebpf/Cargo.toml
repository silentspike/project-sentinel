[package]
name = "sentinel-ebpf"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[features]
default = []
# Feature-gate for real eBPF probe loading (requires CAP_BPF)
ebpf = ["aya", "aya-log"]

[dependencies]
anyhow = { workspace = true }
sentinel-common = { path = "../sentinel-common" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

# eBPF framework (behind feature gate - requires CAP_BPF at runtime)
aya = { version = "0.13", optional = true }
aya-log = { version = "0.2", optional = true }

[dev-dependencies]
approx = { workspace = true }

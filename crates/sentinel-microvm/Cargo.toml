[package]
name = "sentinel-microvm"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
anyhow = { workspace = true }
sentinel-common = { path = "../sentinel-common" }
sentinel-fs = { path = "../sentinel-fs" }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
# test-util aktiviert das conformance-Modul in sentinel-common (sonst hinter
# #[cfg(any(test, feature = "test-util"))] ausgeblendet) — wie bei den anderen Adapter-Crates.
sentinel-common = { path = "../sentinel-common", features = ["test-util"] }
tempfile = "3"

[package]
name = "sentinel-sandbox"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
anyhow = { workspace = true }
landlock = "0.4"
libc = "0.2"
nix = { version = "0.30", features = ["process", "signal"] }
sentinel-common = { path = "../sentinel-common" }
sentinel-fs = { path = "../sentinel-fs" }
sentinel-zenoh = { path = "../sentinel-zenoh" }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
sentinel-common = { path = "../sentinel-common", features = ["test-util"] }
tempfile = "3"
tracing-subscriber = { workspace = true }

[[bin]]
name = "breakout-helper"
path = "src/bin/breakout_helper.rs"

[[bin]]
name = "landlock-wrapper"
path = "src/bin/landlock_wrapper.rs"

[[bench]]
name = "sandbox_bench"
harness = false

[package]
name = "sentinel-workflow"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Durable company workflow execution and independent work-item gate core"

[dependencies]
rusqlite = { version = "0.38", features = ["bundled"] }
sentinel-common = { path = "../sentinel-common" }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tempfile = "3"

[package]
name = "sentinel-runtime"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
sentinel-common = { path = "../sentinel-common" }
sentinel-ecs = { path = "../sentinel-ecs" }
sentinel-limbo = { path = "../sentinel-limbo", default-features = false }
anyhow = { workspace = true }
bevy_ecs = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
sentinel-common = { path = "../sentinel-common", features = ["test-util"] }
sentinel-limbo = { path = "../sentinel-limbo", default-features = false }
tempfile = "3"
criterion = { workspace = true }

[[bench]]
name = "runtime_bench"
harness = false

[package]
name = "sentinel-wasm"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[features]
default = []
wasm = ["dep:wasmtime", "dep:wasmtime-wasi"]

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tracing = { workspace = true }
rustix = { version = "1", features = ["fs"] }
sentinel-common = { path = "../sentinel-common" }
uuid = { workspace = true }
wasmtime = { version = "=49.0.4", features = ["component-model"], optional = true }
wasmtime-wasi = { version = "=49.0.4", optional = true }

[dev-dependencies]
criterion = { workspace = true }
sentinel-common = { path = "../sentinel-common", features = ["test-util"] }
tempfile = "3"

[[bench]]
name = "wasm_benchmarks"
harness = false

[package]
name = "sentinel-ecs"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[features]
default = []
wasm = ["sentinel-wasm/wasm"]

[dependencies]
bevy_ecs = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# #491 (TM-3): deterministischer State-Hash (canonical bincode + sha256) fuer Restore/Replay-Evidence.
sha2 = { workspace = true }
bincode = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
sentinel-common = { path = "../sentinel-common" }
sentinel-bio = { path = "../sentinel-bio" }
sentinel-physics = { path = "../sentinel-physics" }
sentinel-redb = { path = "../sentinel-redb" }
sentinel-limbo = { path = "../sentinel-limbo", default-features = false }
sentinel-wasm = { path = "../sentinel-wasm" }

[dev-dependencies]
sentinel-common = { path = "../sentinel-common" }
# Nur fuer den #381-Bench (Daemon-Record-Pfad); die Library selbst bleibt telemetry-frei.
sentinel-telemetry = { path = "../sentinel-telemetry" }
criterion = { workspace = true }
insta = { workspace = true }
tempfile = "3"
toml = { workspace = true }

[[bench]]
name = "room_phase2_bench"
harness = false

[[bench]]
name = "tick_loop_hotpath_bench"
harness = false

[[bench]]
name = "phase_timing_bench"
harness = false

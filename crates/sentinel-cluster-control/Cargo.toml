[package]
name = "sentinel-cluster-control"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

# Cluster-12 cross-node control plane (Phase 3a0, ADR-2): one cert-pinned QUIC
# control stream carrying request-scoped `ControlEnvelope`s for the owner /
# provision / GC RPCs. Skeleton — the real handler logic lands in #496/#499.

[dependencies]
sentinel-common = { path = "../sentinel-common" }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
rcgen = "0.13"
quinn = { version = "0.11", default-features = false, features = [
    "runtime-tokio",
    "rustls-ring",
] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }

[dev-dependencies]
tokio = { workspace = true }
tempfile = "3"

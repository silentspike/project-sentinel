[package]
name = "sentinel-common"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[features]
default = []
test-util = []
# Pulls `loom` only for the model-checked concurrency test (tests/loom_owner_ordering.rs).
# Off by default so normal builds/CI never compile loom; run with `--features loom-test`.
loom-test = ["dep:loom"]

[dependencies]
bevy_ecs = { workspace = true }
flatbuffers = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
toml = { workspace = true }
uuid = { workspace = true }
bincode = { workspace = true }
# Model-checker for the owner-fence publish ordering (#496); only compiled with the
# `loom-test` feature, so default builds and CI do not pull it.
loom = { version = "0.7", optional = true }

[dev-dependencies]
tempfile = "3"

[[bench]]
name = "owner_fencing_overhead"
harness = false

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

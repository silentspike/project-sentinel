[package]
name = "sentinel-console"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Console data-plane push server: WebTransport/QUIC, manifest+delta (#439)"

[lib]
name = "sentinel_console"
path = "src/lib.rs"

[[bin]]
name = "sentinel-console"
path = "src/main.rs"

[dependencies]
sentinel-console-plane = { path = "../../crates/sentinel-console-plane" }
sentinel-limbo = { path = "../../crates/sentinel-limbo" }
sentinel-common = { path = "../../crates/sentinel-common" }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
wtransport = "0.6"

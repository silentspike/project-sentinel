[package]
name = "sentinel-daemon"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Sentinel Daemon — ECS Orchestrator Binary"

[lib]
name = "sentinel_daemon"
path = "src/lib.rs"

[[bin]]
name = "sentinel-daemon"
path = "src/main.rs"

[dependencies]
sentinel-common = { path = "../../crates/sentinel-common" }
sentinel-cluster-control = { path = "../../crates/sentinel-cluster-control" }
sentinel-ecs = { path = "../../crates/sentinel-ecs" }
sentinel-projection = { path = "../../crates/sentinel-projection" }
sentinel-runtime = { path = "../../crates/sentinel-runtime" }
sentinel-zenoh = { path = "../../crates/sentinel-zenoh" }
sentinel-limbo = { path = "../../crates/sentinel-limbo" }
sentinel-redb = { path = "../../crates/sentinel-redb" }
sentinel-sandbox = { path = "../../crates/sentinel-sandbox" }
sentinel-telemetry = { path = "../../crates/sentinel-telemetry" }
sentinel-ebpf = { path = "../../crates/sentinel-ebpf" }
sentinel-hippocampus = { path = "../../crates/sentinel-hippocampus" }
sentinel-wasm = { path = "../../crates/sentinel-wasm" }
sentinel-fs = { path = "../../crates/sentinel-fs", optional = true }
bevy_ecs = { workspace = true }
redb = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
sha2 = { workspace = true }
clap = { version = "4", features = ["derive"] }
chrono = "0.4"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "blocking"], default-features = false, optional = true }
uuid = { workspace = true }
bincode = { workspace = true }
async-nats = { workspace = true, optional = true }
futures = { version = "0.3", default-features = false, features = ["std", "async-await"], optional = true }

[features]
default = ["llm", "ebpf", "nats", "wasm", "fuse"]
telemetry = ["sentinel-telemetry/telemetry"]
llm = ["reqwest"]
ebpf = ["sentinel-ebpf/ebpf"]
nats = ["async-nats", "futures", "reqwest"]
wasm = ["sentinel-wasm/wasm", "sentinel-ecs/wasm"]
fuse = ["sentinel-fs/fuse-tests"]

[dev-dependencies]
criterion = { workspace = true }
tempfile = "3"

[[bench]]
name = "platform_controlplane_bench"
harness = false

[[bench]]
name = "retention_bench"
harness = false

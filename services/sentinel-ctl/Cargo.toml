[package]
name = "sentinel-ctl"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Sentinel operator CLI — Gaia's local toolbox (CLI statt MCP, #437)"

[[bin]]
name = "sentinel-ctl"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls", "blocking"], default-features = false }

[package]
name = "sentinel-dashboard-backend"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "SOTA dashboard backend: axum HTTP(S) + WebTransport/QUIC, topic+msgpack+zstd framing (#431)"

[lib]
name = "sentinel_dashboard_backend"
path = "src/lib.rs"

[[bin]]
name = "sentinel-dashboard-backend"
path = "src/main.rs"

[dependencies]
# Wiederverwendung bestehender Crates
sentinel-console-plane = { path = "../../crates/sentinel-console-plane" }
sentinel-common = { path = "../../crates/sentinel-common" }
sentinel-limbo = { path = "../../crates/sentinel-limbo" }
# #421: deterministischer Company-Generator (lib, blake3, KEIN LLM) fuer POST /api/config/generate
sentinel-gaia = { path = "../sentinel-gaia" }
# #442: Gaia Console alerts/session bridge (Claude only on explicit POST /api/gaia/*).
sentinel-gaia-loop = { path = "../sentinel-gaia-loop" }
# Workspace-Deps
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
sha2 = { workspace = true }
# HTTP(S)-Server (axum + TLS via rustls) — WebTransport braucht secure context
axum = { version = "0.8", default-features = false, features = ["http1", "json", "matched-path", "original-uri", "query", "tokio", "tower-log", "tracing"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
tower-http = { version = "0.6", features = ["fs", "cors"] }
rustls = "0.23"
rcgen = "0.13"
time = "0.3"
# Control-Proxy HTTP-Client
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Projection-DB read-only
rusqlite = { version = "0.38", features = ["bundled"] }
# Wire-Codec
rmp-serde = "1.3"
zstd = { version = "0.13", default-features = false }
base64 = "0.22"
# WebTransport/QUIC
wtransport = { version = "0.6", default-features = false, features = ["ring"] }
# Event-Stream-Push (#432): NATS JetStream Subscribe + Stream-Iteration
async-nats = { workspace = true }
futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }

[dev-dependencies]
tokio = { workspace = true }
# Auth-Gate-Test (#463): app.oneshot() braucht das tower `util`-Feature.
tower = { version = "0.5", features = ["util"] }
tempfile = "3"

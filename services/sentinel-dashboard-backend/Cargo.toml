[package]
name = "sentinel-dashboard-backend"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "SOTA dashboard backend: axum HTTP(S) + WebTransport/QUIC, topic+msgpack+zstd framing (#431)"

[lib]
name = "sentinel_dashboard_backend"
path = "src/lib.rs"

[[bin]]
name = "sentinel-dashboard-backend"
path = "src/main.rs"

[dependencies]
# Wiederverwendung bestehender Crates
sentinel-console-plane = { path = "../../crates/sentinel-console-plane" }
sentinel-common = { path = "../../crates/sentinel-common" }
sentinel-projection = { path = "../../crates/sentinel-projection" }
sentinel-limbo = { path = "../../crates/sentinel-limbo" }
# Workspace-Deps
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
sha2 = { workspace = true }
# HTTP(S)-Server (axum + TLS via rustls) — WebTransport braucht secure context
axum = "0.8"
axum-server = { version = "0.7", features = ["tls-rustls"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "cors"] }
rustls = "0.23"
rcgen = "0.13"
time = "0.3"
# Control-Proxy HTTP-Client
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Projection-DB read-only
rusqlite = { version = "0.38", features = ["bundled"] }
# Wire-Codec
rmp-serde = "1.3"
zstd = "0.13"
base64 = "0.22"
# WebTransport/QUIC
wtransport = "0.6"

[dev-dependencies]
tokio = { workspace = true }

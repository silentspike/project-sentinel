[package]
name = "agent-runtime"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Lightweight sandbox process for sentinel agents (runs inside bwrap)"

[dependencies]
nix = { version = "0.30", features = ["feature", "signal"] }
sentinel-common = { path = "../../crates/sentinel-common" }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
tempfile = "3"

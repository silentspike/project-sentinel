# Proxmox VM Configuration Reference — Sentinel Deploy VM (VMID 1069)
# Apply via: qm set 1069 <options> or edit /etc/pve/qemu-server/1069.conf
#
# CPU: host-passthrough (AVX2, AES-NI), q35 machine type
# RAM: 24 GB fixed, no ballooning
# Storage: virtio-scsi-single with io_uring AIO
# Network: virtio-net with vhost-net

cpu: host
machine: q35
cores: 12
memory: 24576
balloon: 0
numa: 0

# Storage — NVMe via virtio-scsi
scsihw: virtio-scsi-single
scsi0: local-zfs:vm-1069-disk-0,discard=on,iothread=1,size=80G,ssd=1
ide2: none,media=cdrom

# Network — virtio with vhost-net
net0: virtio=auto,bridge=vmbr0,firewall=0

# Boot
boot: order=scsi0
onboot: 1

# Agent
agent: 1

# Sentinel VM sysctl Configuration Reference
# Apply via: sudo cp sysctl.conf /etc/sysctl.d/99-sentinel.conf && sudo sysctl --system
# Or use: deploy/scripts/init-sysctl.sh

# Minimize swapping (keep swap for emergency only)
vm.swappiness = 1

# Increase dirty page limits for write batching
vm.dirty_ratio = 20
vm.dirty_background_ratio = 5

# Increase max memory map areas (redb mmap + Zenoh SHM)
vm.max_map_count = 262144

# Network tuning for Zenoh pub/sub
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216

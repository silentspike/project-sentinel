# Kernel Boot Parameters Reference — Sentinel Deploy VM
# Apply via: edit /etc/default/grub GRUB_CMDLINE_LINUX_DEFAULT, then update-grub
#
# mitigations=off     — 5-15% boost (trusted VM, no multi-tenant)
# processor.max_cstate=1 — no deep C-states, <100us wake latency
# transparent_hugepage=madvise — NOT always (anti-pattern for redb mmap)
# elevator=none       — host handles I/O scheduling

GRUB_CMDLINE_LINUX_DEFAULT="mitigations=off processor.max_cstate=1 transparent_hugepage=madvise elevator=none"

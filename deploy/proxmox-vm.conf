# Sentinel VM baseline profile (qm set values)
# Usage example:
#   qm set 1069 --cpu host --machine q35 --numa 1 --balloon 0 \
#     --scsihw virtio-scsi-single \
#     --scsi0 local-zfs:vm-1069-disk-0,discard=on,iothread=1,aio=io_uring \
#     --onboot 1 --agent enabled=1 --ostype l26

cpu=host
machine=q35
numa=1
balloon=0
scsihw=virtio-scsi-single
scsi0_opts=discard=on,iothread=1,aio=io_uring
onboot=1
agent=enabled=1
ostype=l26

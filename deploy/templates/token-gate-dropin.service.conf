# Token-gate systemd drop-in for LLM-touching Sentinel services (#517 / G3).
#
# ProvisionNode renders this onto each provisioned node into
#   /etc/systemd/system/<unit>.d/token-gate.conf
# for gateway / judge / health-monitor.timer, then runs `systemctl daemon-reload`.
#
# Effect: the unit starts ONLY when /etc/sentinel/allow-llm exists. That file is
# absent by default, so a freshly-provisioned node never brings LLM-touching
# services up on boot (no token bleed / no OOM from an autostart). To enable on a
# node: `sudo touch /etc/sentinel/allow-llm` (and `sudo rm` to disable again).
#
# This is the repo-versioned source of the VM-side drift (the repo service units
# deliberately carry no ConditionPathExists). ProvisionNode verifies this file's
# checksum before installing it (G3 — single, reviewable template, not synthesized).
[Unit]
ConditionPathExists=/etc/sentinel/allow-llm

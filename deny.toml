# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

# ──────────────────────────────────────────────
# Advisory Database (RustSec)
# ──────────────────────────────────────────────
[advisories]
# vulnerability + notice: removed in cargo-deny v2 (vulnerabilities always emit errors)
# unmaintained/unsound: scope of crates to check (all|workspace|transitive|none)
unmaintained = "workspace"
unsound = "all"
yanked = "deny"

# ──────────────────────────────────────────────
# License Compliance
# ──────────────────────────────────────────────
[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "BSL-1.0",
    "CC0-1.0",
    "OpenSSL",
    "MPL-2.0",
]
confidence-threshold = 0.8

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

# ──────────────────────────────────────────────
# Crate Bans
# ──────────────────────────────────────────────
[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

# ──────────────────────────────────────────────
# Source Control
# ──────────────────────────────────────────────
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

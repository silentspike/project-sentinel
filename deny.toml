# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

# ──────────────────────────────────────────────
# Advisory Database (RustSec)
# ──────────────────────────────────────────────
[advisories]
# vulnerability + notice: removed in cargo-deny v2 (vulnerabilities always emit errors)
# unmaintained/unsound: scope of crates to check (all|workspace|transitive|none)
unmaintained = "workspace"
unsound = "all"
yanked = "deny"
ignore = [
    # rsa 0.9.x Marvin Attack (RUSTSEC-2023-0071): No fix available, transitive via zenoh.
    # We don't use RSA directly. Track: https://github.com/RustCrypto/RSA/issues/19
    { id = "RUSTSEC-2023-0071", reason = "transitive via zenoh, no safe upgrade available" },
    # Wasmtime WASI advisories (RUSTSEC-2026-0020/0021/0022): Requires wasmtime major upgrade.
    # sentinel-wasm uses wasmtime 41, fix likely in 42+. Tracked as separate deps issue.
    { id = "RUSTSEC-2026-0020", reason = "wasmtime 41 -> 42+ upgrade needed, separate issue" },
    { id = "RUSTSEC-2026-0021", reason = "wasmtime 41 -> 42+ upgrade needed, separate issue" },
    { id = "RUSTSEC-2026-0022", reason = "wasmtime 41 -> 42+ upgrade needed, separate issue" },
    # bincode 1.3.3 unmaintained (RUSTSEC-2025-0141): Team ceased development.
    # v1.3.3 is considered complete. Used for World Snapshot serialization.
    { id = "RUSTSEC-2025-0141", reason = "bincode 1.3.3 is feature-complete, no security issue" },
    # LZ4 memory leak (RUSTSEC-2026-0041): Transitive via zenoh/redb.
    # We don't decompress untrusted LZ4 data.
    { id = "RUSTSEC-2026-0041", reason = "transitive dependency, no untrusted LZ4 decompression" },
]

# ──────────────────────────────────────────────
# License Compliance
# ──────────────────────────────────────────────
[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "BSL-1.0",
    "CC0-1.0",
    "OpenSSL",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

# ──────────────────────────────────────────────
# Crate Bans
# ──────────────────────────────────────────────
[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
# Workspace-interne path dependencies sind wildcards - das ist normal
allow-wildcard-paths = true

# ──────────────────────────────────────────────
# Source Control
# ──────────────────────────────────────────────
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/aya-rs/aya"]

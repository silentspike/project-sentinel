[workspace]
resolver = "2"
members = [
    "crates/sentinel-ecs",
    "crates/sentinel-bio",
    "crates/sentinel-physics",
    "crates/sentinel-zenoh",
    "crates/sentinel-redb",
    "crates/sentinel-limbo",
    "crates/sentinel-sandbox",
    "crates/sentinel-ebpf",
    "crates/sentinel-wasm",
    "crates/sentinel-common",
    "crates/sentinel-telemetry",
]

[workspace.dependencies]
bevy_ecs = "0.15"
zenoh = "1.1"
redb = "3.1"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
flatbuffers = "25.12"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
toml = "0.8"
approx = "0.5"

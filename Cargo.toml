[workspace]
resolver = "2"
exclude = [
    "crates/sentinel-ebpf-probes",
    "crates/sentinel-inference",
    "crates/sentinel-wasm/tests/fixtures/echo-plugin",
    "crates/sentinel-wasm/tests/fixtures/loop-plugin",
    "crates/sentinel-wasm/tests/fixtures/fs-plugin",
]
members = [
    "crates/sentinel-ecs",
    "crates/sentinel-bio",
    "crates/sentinel-physics",
    "crates/sentinel-zenoh",
    "crates/sentinel-redb",
    "crates/sentinel-limbo",
    "crates/sentinel-sandbox",
    "crates/sentinel-ebpf",
    "crates/sentinel-wasm",
    "crates/sentinel-common",
    "crates/sentinel-cluster-control",
    "crates/sentinel-telemetry",
    "crates/sentinel-runtime",
    "crates/sentinel-hippocampus",
    "crates/sentinel-gaia-memory",
    "crates/sentinel-projection",
    "crates/sentinel-fs",
    "crates/sentinel-console-plane",
    "crates/sentinel-microvm",
    "services/sentinel-nightrun",
    "services/sentinel-gaia",
    "services/sentinel-gaia-loop",
    "services/sentinel-daemon",
    "services/sentinel-projection",
    "services/agent-runtime",
    "services/sentinel-ctl",
    "services/sentinel-dashboard-backend",
]

[workspace.dependencies]
bevy_ecs = "0.18"
zenoh = "1.1"
redb = "3.1"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
flatbuffers = "25.12"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
serde_json = "1"
bincode = { version = "2.0.1", features = ["serde"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
anyhow = "1"
toml = "1.0"
approx = "0.5"
criterion = { version = "0.8", features = ["html_reports"] }
bolero = "0.13"
insta = { version = "1.42", features = ["yaml"] }
sha2 = "0.10"
blake3 = "1"
rayon = "1"
async-nats = "0.47"

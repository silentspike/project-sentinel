run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gosec
    - gocyclo
    - misspell
    - prealloc

linters-settings:
  gocyclo:
    min-complexity: 20
  gosec:
    severity: medium

issues:
  max-issues-per-linter: 50
  max-same-issues: 5

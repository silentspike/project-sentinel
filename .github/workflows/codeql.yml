name: CodeQL

on:
  push:
    branches: [main]
    paths:
      - 'cmd/**'
      - 'pkg/**'
      - 'services/**'
      - 'dashboard/**'
      - '.github/codeql/**'
      - '.github/workflows/codeql.yml'
  pull_request:
    branches: [main]
    paths:
      - 'cmd/**'
      - 'pkg/**'
      - 'services/**'
      - 'dashboard/**'
      - '.github/codeql/**'
      - '.github/workflows/codeql.yml'
  schedule:
    - cron: '0 4 * * 3'  # Wednesday 04:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read
  security-events: write
  actions: read  # required by codeql-action/analyze to read workflow run metadata

jobs:
  # Go analysis. The Go workspace builds via `go build ./...` in each
  # workspace member directory; that is what CodeQL needs to see.
  analyze-go:
    name: CodeQL (Go)
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version-file: cmd/cortex-gateway/go.mod

      - uses: github/codeql-action/init@89a39a4e59826350b863aa6b6252a07ad50cf83e # v4.32.4
        with:
          languages: go
          build-mode: manual
          config-file: ./.github/codeql/codeql-config.yml

      - name: Build Go modules manually
        run: |
          set -euo pipefail
          for module in cmd/cortex-gateway services/sentinel-judge \
                        services/sentinel-nats-bridge pkg/sentinel-go; do
            echo "::group::Build $module"
            (cd "$module" && go build ./...)
            echo "::endgroup::"
          done

      - uses: github/codeql-action/analyze@89a39a4e59826350b863aa6b6252a07ad50cf83e # v4.32.4
        with:
          category: go

  # Dashboard analysis. Bun/TSX is reported as javascript-typescript.
  # JavaScript/TypeScript only supports build-mode: none (CodeQL extracts
  # source directly without compilation). We still install dependencies
  # and run typecheck so any imported TypeScript files reachable through
  # the dependency graph are present on disk for the extractor.
  analyze-dashboard:
    name: CodeQL (Dashboard)
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v6.0.0
        with:
          # CodeQL JS extractor invokes node for TypeScript parsing.
          # Without this step the self-hosted runner has no node on PATH
          # and the extractor crashes with `Could not start Node.js`.
          node-version: '24'

      - uses: oven-sh/setup-bun@4bc047ad259df6fc24a6c9b0f9a0cb08cf17fbe5 # v2
        with:
          bun-version: 1.1.30

      - name: Install dashboard dependencies + typecheck
        working-directory: dashboard
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run typecheck

      - uses: github/codeql-action/init@89a39a4e59826350b863aa6b6252a07ad50cf83e # v4.32.4
        with:
          languages: javascript-typescript
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml

      - uses: github/codeql-action/analyze@89a39a4e59826350b863aa6b6252a07ad50cf83e # v4.32.4
        with:
          category: dashboard

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────
  # Detect which parts of the codebase changed
  # ──────────────────────────────────────────────
  changes:
    runs-on: [self-hosted, linux, x64]
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      go: ${{ steps.filter.outputs.go }}
      dashboard: ${{ steps.filter.outputs.dashboard }}
      schemas: ${{ steps.filter.outputs.schemas }}
      config: ${{ steps.filter.outputs.config }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
            go:
              - 'cmd/**'
              - 'go.work'
              - 'go.work.sum'
            dashboard:
              - 'dashboard/**'
            schemas:
              - 'schemas/**'
            config:
              - 'config/**'

  # ──────────────────────────────────────────────
  # Always runs - fast checks (<30s)
  # Merged: lint + typos (saves runner startup)
  # ──────────────────────────────────────────────
  lint:
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Reject hidden Unicode / Bidi characters
        run: |
          if grep -rP '[\x{200B}-\x{200F}\x{202A}-\x{202E}\x{2066}-\x{2069}]' \
            --include='*.rs' --include='*.go' --include='*.ts' --include='*.js' \
            --include='*.md' --include='*.toml' --include='*.yml' --include='*.yaml' \
            --include='*.fbs' --include='*.sql' .; then
            echo "::error::Hidden Unicode/Bidi characters found!"
            exit 1
          fi

      - name: Validate TOML configs
        run: |
          for f in $(find config -name '*.toml' 2>/dev/null); do
            python3 -c "import tomllib; tomllib.load(open('$f','rb'))" || exit 1
          done

      - name: Typo detection
        uses: crate-ci/typos@631208b7aac2daa8b707f55e7331f9112b0e062d # v1.44.0

  # ──────────────────────────────────────────────
  # Rust - only when crates/ or Cargo.* changed
  # ──────────────────────────────────────────────
  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.config == 'true'
    runs-on: [self-hosted, linux, x64]
    env:
      CARGO_BUILD_JOBS: "3"
      # Persistent local cache on self-hosted runner - avoids GitHub API
      # upload/download overhead (~1.3GB per run). Each runner instance
      # gets its own target dir via RUNNER_NAME to prevent lock contention.
      CARGO_TARGET_DIR: /opt/cargo-cache/${{ runner.name }}/target
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7 # stable
        with:
          components: rustfmt, clippy

      - name: Ensure local cache dir
        run: mkdir -p "$CARGO_TARGET_DIR"

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rustdoc warnings
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --no-deps --document-private-items

      - name: Tests
        run: cargo test --workspace

      - name: Clippy (eBPF feature)
        run: cargo clippy -p sentinel-daemon -p sentinel-ebpf --features ebpf -- -D warnings

      - name: Tests (eBPF feature)
        run: cargo test -p sentinel-ebpf --features ebpf

      - name: Unused dependencies
        uses: taiki-e/install-action@288875dd3d64326724fa6d9593062d9f8ba0b131 # v2.67.30
        with:
          tool: cargo-machete
      - run: cargo machete || echo "::warning::Unused dependencies found (non-blocking)"

  # ──────────────────────────────────────────────
  # Go - only when cmd/ changed
  # ──────────────────────────────────────────────
  go:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version-file: cmd/cortex-gateway/go.mod
          cache-dependency-path: cmd/cortex-gateway/go.sum

      - name: Build
        working-directory: cmd/cortex-gateway
        run: go build ./...

      - name: Vet
        working-directory: cmd/cortex-gateway
        run: go vet ./...

      - name: Tests
        working-directory: cmd/cortex-gateway
        run: go test -race -count=1 ./...

      - name: Lint
        uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20 # v9.2.0
        with:
          working-directory: cmd/cortex-gateway

  # ──────────────────────────────────────────────
  # Dashboard - only when dashboard/ changed
  # ──────────────────────────────────────────────
  dashboard:
    needs: changes
    if: needs.changes.outputs.dashboard == 'true'
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Bun (baseline for legacy CPU)
        run: |
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

      - name: Install
        working-directory: dashboard
        run: bun install --frozen-lockfile

      - name: Type check
        working-directory: dashboard
        run: bun run typecheck || true

      - name: Tests
        working-directory: dashboard
        run: bun test

  # ──────────────────────────────────────────────
  # FlatBuffer schema validation
  # ──────────────────────────────────────────────
  schemas:
    needs: changes
    if: needs.changes.outputs.schemas == 'true'
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install flatc
        run: |
          curl -LO https://github.com/google/flatbuffers/releases/latest/download/Linux.flatbuffers.binary.clang++-17.zip
          unzip Linux.flatbuffers.binary.clang++-17.zip -d /usr/local/bin/ || true
          chmod +x /usr/local/bin/flatc || true

      - name: Validate schemas
        run: |
          for f in schemas/*.fbs; do
            flatc --no-gen-all -o /tmp "$f" || exit 1
          done

  # ──────────────────────────────────────────────
  # Gate - single status check for branch protection
  # All jobs must pass (skipped counts as pass)
  # ──────────────────────────────────────────────
  ci-pass:
    if: always()
    needs: [lint, rust, go, dashboard, schemas]
    runs-on: [self-hosted, linux, x64]
    steps:
      - name: Evaluate results
        run: |
          results=(
            "${{ needs.lint.result }}"
            "${{ needs.rust.result }}"
            "${{ needs.go.result }}"
            "${{ needs.dashboard.result }}"
            "${{ needs.schemas.result }}"
          )
          for r in "${results[@]}"; do
            if [[ "$r" == "failure" || "$r" == "cancelled" ]]; then
              echo "::error::Job failed with result: $r"
              exit 1
            fi
          done
          echo "All checks passed or were skipped."

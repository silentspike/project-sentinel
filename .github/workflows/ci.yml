name: CI

# Switch runner mode via GitHub repo variable:
#   Settings → Variables → Actions → RUNNER_MODE
#   "hosted"      → ubuntu-latest (uses GitHub-hosted minutes)
#   "self-hosted"  → [self-hosted, linux, x64] (default)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────
  # Detect which parts of the codebase changed
  # ──────────────────────────────────────────────
  changes:
    runs-on: ${{ ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) || vars.RUNNER_MODE == 'hosted') && 'ubuntu-latest' || fromJSON('["self-hosted", "linux", "x64"]') }}
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      go: ${{ steps.filter.outputs.go }}
      console: ${{ steps.filter.outputs.console }}
      schemas: ${{ steps.filter.outputs.schemas }}
      config: ${{ steps.filter.outputs.config }}
      bans: ${{ steps.filter.outputs.bans }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify complete candidate changes
        id: filter
        env:
          CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/ci/route.py classify --base "$CI_BASE" --head "$CI_HEAD"

  # ──────────────────────────────────────────────
  # Always runs - fast checks (<30s)
  # ──────────────────────────────────────────────
  lint:
    runs-on: ${{ ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) || vars.RUNNER_MODE == 'hosted') && 'ubuntu-latest' || fromJSON('["self-hosted", "linux", "x64"]') }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Reject hidden Unicode / Bidi characters
        run: |
          if grep -rP '[\x{200B}-\x{200F}\x{202A}-\x{202E}\x{2066}-\x{2069}]' \
            --include='*.rs' --include='*.go' --include='*.ts' --include='*.js' \
            --include='*.md' --include='*.toml' --include='*.yml' --include='*.yaml' \
            --include='*.fbs' --include='*.sql' .; then
            echo "::error::Hidden Unicode/Bidi characters found!"
            exit 1
          fi

      - name: Unsafe baseline
        run: python3 scripts/check-unsafe-baseline.py

      - name: Fenced-writer enforcement (#496)
        run: python3 scripts/check-fenced-writers.py

      - name: Canonical event append boundary (#732)
        run: |
          python3 scripts/check-event-append-boundary.py
          python3 -m unittest discover -s scripts/tests -p 'test_check_event_append_boundary.py'

      - name: Dependency patch registry enforcement (#634)
        run: |
          python3 scripts/check-patch-registry.py
          python3 -m unittest discover -s scripts/tests -p 'test_check_patch_registry.py'

      - name: Projection provisioning contract (#644)
        run: bash scripts/check-projection-provisioning.sh

      - name: Runtime-base provisioning contract (#646)
        run: bash scripts/check-runtime-base-provisioning.sh

      - name: Install Node for native QA mechanism tests
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: '22'

      - name: CI routing, provenance and exact-head merge regressions
        env:
          TMPDIR: /work/tmp/sentinel-ci-contracts
        run: |
          sudo install -d -m 0700 -o "$(id -u)" -g "$(id -g)" "$TMPDIR"
          python3 -m unittest discover -s scripts/ci/tests -p 'test_*.py'

      - name: Remote parallel-delivery mechanism regressions
        env:
          TMPDIR: /work/tmp/sentinel-ci-contracts
        run: |
          test -f scripts/ci/test-archive-tests.py
          test -f scripts/product-acceptance/remote_parallel_test.py
          test -f scripts/product-acceptance/remote_parallel_desktop_test.mjs
          test -f deploy/ci-lab/test_control.py
          python3 -B scripts/ci/test-archive-tests.py -v
          python3 -B -m unittest discover -s scripts/product-acceptance -p 'remote_parallel_test.py' -v
          node --test scripts/product-acceptance/remote_parallel_desktop_test.mjs
          python3 -B -m unittest discover -s deploy/ci-lab -p 'test_*.py' -v
          bash -n deploy/ci-lab/prepare-guest.sh

      - name: Virtual-company M0 product contract (#693)
        env:
          SENTINEL_CI_SCRATCH: /work/tmp/sentinel-ci-product-acceptance
        run: |
          if [[ ! -d /work/tmp ]]; then sudo install -d -m 0755 /work/tmp; fi
          sudo install -d -m 0700 -o "$(id -u)" -g "$(id -g)" "$SENTINEL_CI_SCRATCH"
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
          sudo sysctl --load deploy/vm-config/99-sentinel-bwrap.conf
          command -v node
          python3 scripts/product-acceptance/check_contract.py --check
          env RUNNER_TEMP="$SENTINEL_CI_SCRATCH" python3 -m unittest discover -s scripts/product-acceptance -p 'test_*.py'

      - name: Validate TOML configs
        run: |
          for f in $(find config -name '*.toml' 2>/dev/null); do
            python3 -c "import tomllib; tomllib.load(open('$f','rb'))" || exit 1
          done

      - name: Typo detection
        uses: crate-ci/typos@631208b7aac2daa8b707f55e7331f9112b0e062d # v1.44.0

  # ----------------------------------------------
  # Required through ci-pass when Cargo policy inputs change
  # ----------------------------------------------
  bans:
    needs: changes
    if: needs.changes.outputs.bans == 'true'
    runs-on: ${{ ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) || vars.RUNNER_MODE == 'hosted') && 'ubuntu-latest' || fromJSON('["self-hosted", "linux", "x64"]') }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Enforce duplicate-version bans
        uses: EmbarkStudios/cargo-deny-action@3fd3802e88374d3fe9159b834c7714ec57d6c979 # v2.0.15
        with:
          command: check bans

  # ──────────────────────────────────────────────
  # Rust static analysis - fmt + clippy + machete
  # Parallel to rust-doc / rust-test / rust-ebpf (fans across runners)
  # ──────────────────────────────────────────────
  rust-static:
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.config == 'true'
    runs-on: ${{ ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) || vars.RUNNER_MODE == 'hosted') && 'ubuntu-latest' || fromJSON('["self-hosted", "linux", "x64"]') }}
    env:
      CARGO_BUILD_JOBS: ${{ ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) || vars.RUNNER_MODE == 'hosted') && '2' || '3' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: "1.99.0"
          components: rustfmt, clippy
      - name: Assert determinism toolchain (DEV-010)
        run: |
          EXPECT="1.99.0"; ACTUAL="$(rustc --version | awk '{print $2}')"
          echo "rustc: $ACTUAL (DEV-010 expects $EXPECT)"
          test "$ACTUAL" = "$EXPECT" || { echo "::error::DEV-010 determinism profile violated: rustc $ACTUAL != $EXPECT"; exit 1; }
      - name: Configure local cache (self-hosted)
        if: vars.RUNNER_MODE != 'hosted' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        run: |
          export CARGO_TARGET_DIR="$HOME/.cache/project-sentinel/cargo-target/${{ runner.name }}/target"
          mkdir -p "$CARGO_TARGET_DIR"
          echo "CARGO_TARGET_DIR=$CARGO_TARGET_DIR" >> "$GITHUB_ENV"
      - name: Rust cache (hosted)
        if: ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) || vars.RUNNER_MODE == 'hosted')
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: sentinel-hosted-static

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Unused dependencies
        uses: taiki-e/install-action@288875dd3d64326724fa6d9593062d9f8ba0b131 # v2.67.30
        with:
          tool: cargo-machete
      - run: cargo machete || echo "::warning::Unused dependencies found (non-blocking)"

  # ──────────────────────────────────────────────
  # Rust docs - rustdoc warnings (own compile, parallel)
  # ──────────────────────────────────────────────
  rust-doc:
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.config == 'true'
    runs-on: ${{ ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) || vars.RUNNER_MODE == 'hosted') && 'ubuntu-latest' || fromJSON('["self-hosted", "linux", "x64"]') }}
    env:
      CARGO_BUILD_JOBS: ${{ ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) || vars.RUNNER_MODE == 'hosted') && '2' || '3' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: "1.99.0"
      - name: Assert determinism toolchain (DEV-010)
        run: |
          EXPECT="1.99.0"; ACTUAL="$(rustc --version | awk '{print $2}')"
          echo "rustc: $ACTUAL (DEV-010 expects $EXPECT)"
          test "$ACTUAL" = "$EXPECT" || { echo "::error::DEV-010 determinism profile violated: rustc $ACTUAL != $EXPECT"; exit 1; }
      - name: Configure local cache (self-hosted)
        if: vars.RUNNER_MODE != 'hosted' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        run: |
          export CARGO_TARGET_DIR="$HOME/.cache/project-sentinel/cargo-target/${{ runner.name }}/target"
          mkdir -p "$CARGO_TARGET_DIR"
          echo "CARGO_TARGET_DIR=$CARGO_TARGET_DIR" >> "$GITHUB_ENV"
      - name: Rust cache (hosted)
        if: ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) || vars.RUNNER_MODE == 'hosted')
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: sentinel-hosted-doc

      - name: Rustdoc warnings
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --no-deps --document-private-items

  # ──────────────────────────────────────────────
  # Rust tests - workspace + snapshot tests (own compile, parallel)
  # ──────────────────────────────────────────────
  rust-test:
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.config == 'true'
    runs-on: ${{ ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) || vars.RUNNER_MODE == 'hosted') && 'ubuntu-latest' || fromJSON('["self-hosted", "linux", "x64"]') }}
    env:
      CARGO_BUILD_JOBS: ${{ ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) || vars.RUNNER_MODE == 'hosted') && '2' || '3' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: "1.99.0"
      - name: Assert determinism toolchain (DEV-010)
        run: |
          EXPECT="1.99.0"; ACTUAL="$(rustc --version | awk '{print $2}')"
          echo "rustc: $ACTUAL (DEV-010 expects $EXPECT)"
          test "$ACTUAL" = "$EXPECT" || { echo "::error::DEV-010 determinism profile violated: rustc $ACTUAL != $EXPECT"; exit 1; }
      - name: Configure local cache (self-hosted)
        if: vars.RUNNER_MODE != 'hosted' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        run: |
          export CARGO_TARGET_DIR="$HOME/.cache/project-sentinel/cargo-target/${{ runner.name }}/target"
          mkdir -p "$CARGO_TARGET_DIR"
          echo "CARGO_TARGET_DIR=$CARGO_TARGET_DIR" >> "$GITHUB_ENV"
      - name: Rust cache (hosted)
        if: ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) || vars.RUNNER_MODE == 'hosted')
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: sentinel-hosted-test

      - name: Install bubblewrap runtime dependency (hosted)
        if: ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) || vars.RUNNER_MODE == 'hosted')
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
          sudo sysctl --load deploy/vm-config/99-sentinel-bwrap.conf

      - name: Verify bubblewrap runtime dependency
        run: |
          test -f /usr/bin/bwrap
          test -x /usr/bin/bwrap
          test "$(stat -c '%F' /usr/bin/bwrap)" = "regular file"
          test "$(stat -c '%u' /usr/bin/bwrap)" = "0"
          dpkg-query -W -f='bubblewrap package: ${Package} ${Version}\n' bubblewrap
          /usr/bin/bwrap --version
          test "$(cat /sys/module/apparmor/parameters/enabled)" = "Y"
          test "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)" = "0"
          test "$(sysctl -n kernel.unprivileged_userns_clone)" = "1"
          credential_dir="$RUNNER_TEMP/bwrap-credential-smoke"
          install -d -m 0700 "$credential_dir"
          trap 'rmdir "$credential_dir"' EXIT
          /usr/bin/bwrap \
            --die-with-parent \
            --unshare-pid \
            --bind / / \
            --proc /proc \
            --tmpfs "$credential_dir" \
            -- /bin/true

      - name: Tests
        run: cargo test --workspace

      - name: Snapshot tests
        run: |
          command -v cargo-insta >/dev/null 2>&1 || cargo install cargo-insta --locked
          cargo insta test -p sentinel-ecs --test snapshot_perception --check
          cargo insta test -p sentinel-physics --test snapshot_perception --check

  # ──────────────────────────────────────────────
  # Rust eBPF feature - separate feature compile (parallel)
  # ──────────────────────────────────────────────
  rust-ebpf:
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.config == 'true'
    runs-on: ${{ ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) || vars.RUNNER_MODE == 'hosted') && 'ubuntu-latest' || fromJSON('["self-hosted", "linux", "x64"]') }}
    env:
      CARGO_BUILD_JOBS: ${{ ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) || vars.RUNNER_MODE == 'hosted') && '2' || '3' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: "1.99.0"
          components: clippy
      - name: Assert determinism toolchain (DEV-010)
        run: |
          EXPECT="1.99.0"; ACTUAL="$(rustc --version | awk '{print $2}')"
          echo "rustc: $ACTUAL (DEV-010 expects $EXPECT)"
          test "$ACTUAL" = "$EXPECT" || { echo "::error::DEV-010 determinism profile violated: rustc $ACTUAL != $EXPECT"; exit 1; }
      - name: Configure local cache (self-hosted)
        if: vars.RUNNER_MODE != 'hosted' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        run: |
          export CARGO_TARGET_DIR="$HOME/.cache/project-sentinel/cargo-target/${{ runner.name }}/target"
          mkdir -p "$CARGO_TARGET_DIR"
          echo "CARGO_TARGET_DIR=$CARGO_TARGET_DIR" >> "$GITHUB_ENV"
      - name: Rust cache (hosted)
        if: ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) || vars.RUNNER_MODE == 'hosted')
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: sentinel-hosted-ebpf

      # These userspace feature gates need no host kernel headers/tools.
      # Actual privileged kernel probes remain a separate lab acceptance path.
      - name: Clippy (eBPF feature)
        run: cargo clippy -p sentinel-daemon -p sentinel-ebpf --features ebpf -- -D warnings

      - name: Tests (eBPF feature)
        run: cargo test -p sentinel-ebpf --features ebpf

  # ──────────────────────────────────────────────
  # Go - when any shipped Go module or shared schema changes
  # ──────────────────────────────────────────────
  go:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ${{ ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) || vars.RUNNER_MODE == 'hosted') && 'ubuntu-latest' || fromJSON('["self-hosted", "linux", "x64"]') }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version-file: cmd/cortex-gateway/go.mod
          cache-dependency-path: |
            cmd/cortex-gateway/go.sum
            pkg/sentinel-go/go.sum
            services/sentinel-judge/go.sum
            services/sentinel-nats-bridge/go.sum

      - name: Build
        run: go build ./cmd/cortex-gateway/... ./pkg/sentinel-go/... ./services/sentinel-judge/... ./services/sentinel-nats-bridge/...

      - name: Vet
        run: go vet ./cmd/cortex-gateway/... ./pkg/sentinel-go/... ./services/sentinel-judge/... ./services/sentinel-nats-bridge/...

      - name: Tests
        run: go test -race -count=1 ./cmd/cortex-gateway/... ./pkg/sentinel-go/... ./services/sentinel-judge/... ./services/sentinel-nats-bridge/...

      - name: Lint
        uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20 # v9.2.0
        with:
          working-directory: cmd/cortex-gateway
          verify: false
          args: --timeout=5m
        env:
          GOLANGCI_LINT_SKIP_CONFIG_VERIFY: "true"

  # ──────────────────────────────────────────────
  # Console - only when console/ changed
  # ──────────────────────────────────────────────
  console:
    needs: changes
    if: needs.changes.outputs.console == 'true'
    runs-on: ${{ ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) || vars.RUNNER_MODE == 'hosted') && 'ubuntu-latest' || fromJSON('["self-hosted", "linux", "x64"]') }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Self-hosted: manual Bun install (baseline for legacy CPU)
      - name: Install Bun (self-hosted)
        if: vars.RUNNER_MODE != 'hosted' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        run: |
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

      # Hosted: setup-bun action
      - name: Install Bun (hosted)
        if: ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) || vars.RUNNER_MODE == 'hosted')
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        working-directory: console
        run: bun install --frozen-lockfile

      - name: Type check
        working-directory: console
        run: bun run typecheck

      - name: Tests
        working-directory: console
        run: bun run test

      - name: Build
        working-directory: console
        run: bun run build

  # ──────────────────────────────────────────────
  # FlatBuffer schema validation
  # ──────────────────────────────────────────────
  schemas:
    needs: changes
    if: needs.changes.outputs.schemas == 'true'
    runs-on: ${{ ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) || vars.RUNNER_MODE == 'hosted') && 'ubuntu-latest' || fromJSON('["self-hosted", "linux", "x64"]') }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install flatc
        run: |
          archive="$RUNNER_TEMP/Linux.flatc.binary.clang++-18.zip"
          curl --fail --location --silent --show-error \
            --output "$archive" \
            'https://github.com/google/flatbuffers/releases/download/v25.12.19-2026-02-06-03fffb2/Linux.flatc.binary.clang%2B%2B-18.zip'
          echo '2cd7f7fcee4ca898d045054aa3e83406b2619f4f652b8c2bc2d444d5402a4c77  '"$archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/flatc-bin"
          unzip -q "$archive" -d "$RUNNER_TEMP/flatc-bin"
          chmod 0755 "$RUNNER_TEMP/flatc-bin/flatc"
          echo "$RUNNER_TEMP/flatc-bin" >> "$GITHUB_PATH"

      - name: Validate schemas
        run: |
          mkdir -p "$RUNNER_TEMP/flatc-output"
          for f in schemas/*.fbs; do
            flatc --cpp --no-includes -o "$RUNNER_TEMP/flatc-output" "$f"
          done

  # ──────────────────────────────────────────────
  # Gate - single status check for branch protection
  # Required jobs must succeed; skips are allowed only for unaffected paths.
  # ──────────────────────────────────────────────
  ci-pass:
    if: always()
    needs: [changes, lint, bans, rust-static, rust-doc, rust-test, rust-ebpf, go, console, schemas]
    runs-on: ${{ ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) || vars.RUNNER_MODE == 'hosted') && 'ubuntu-latest' || fromJSON('["self-hosted", "linux", "x64"]') }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Evaluate results
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/ci/route.py evaluate

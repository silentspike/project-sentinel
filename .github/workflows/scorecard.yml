name: Scorecard

on:
  # Scorecard ist nur fuer public Repos sinnvoll.
  # Automatische Trigger deaktiviert bis Repo public wird.
  # schedule:
  #   - cron: '0 7 * * 1'  # Montag 07:00 UTC
  # push:
  #   branches: [main]
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: OSSF Scorecard
    runs-on: ${{ vars.RUNNER_MODE == 'hosted' && 'ubuntu-latest' || fromJSON('["self-hosted", "linux", "x64"]') }}
    permissions:
      contents: read
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a # v2.4.3
        with:
          results_file: results.sarif
          results_format: sarif
          # #599: publish only on the default branch. The scorecard-action
          # rejects publish_results on non-default branches with "Only the
          # default branch main is supported"; on main the repo is now public
          # (the Feb-2026 ListCommits failure was the private-repo era), so
          # publishing works there. Conditional publish lets the workflow run
          # green on PR/feature branches (results computed, just not published).
          publish_results: ${{ github.ref == 'refs/heads/main' }}

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@89a39a4e59826350b863aa6b6252a07ad50cf83e # v4.32.4
        with:
          sarif_file: results.sarif

name: Scorecard

on:
  # Scorecard ist nur fuer public Repos sinnvoll.
  # Automatische Trigger deaktiviert bis Repo public wird.
  # schedule:
  #   - cron: '0 7 * * 1'  # Montag 07:00 UTC
  # push:
  #   branches: [main]
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: OSSF Scorecard
    # #599: hardcoded ubuntu-latest (NOT the RUNNER_MODE switch). The scorecard
    # webapp publishing requires "exactly 1 Ubuntu virtual environment"; the
    # RUNNER_MODE switch resolves to self-hosted by default and publishing fails
    # with "should have exactly 1 Ubuntu". Scorecard is public-repo + default-
    # branch only anyway, so a GitHub-hosted ubuntu runner is correct here.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a # v2.4.3
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@89a39a4e59826350b863aa6b6252a07ad50cf83e # v4.32.4
        with:
          sarif_file: results.sarif

name: PR Quality Gate

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
    branches: [main]

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  gate:
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const pr = context.payload.pull_request;
            const body = pr.body || "";
            const failures = [];

            const botActors = ["dependabot[bot]", "github-actions[bot]", "renovate[bot]"];
            if (botActors.includes(pr.user.login)) {
              core.info(`Bot PR detected (${pr.user.login}). Skipping quality gate.`);
              return;
            }

            if (pr.draft) {
              core.info("Draft PR detected. Skipping strict quality gate until ready_for_review.");
              return;
            }

            const requiredSections = [
              "## Summary",
              "## Changes",
              "## Linked Issues",
              "## Test Plan",
              "## Benchmarks",
              "## Evidence (AC Mapping)",
              "## Checklist",
            ];
            for (const section of requiredSections) {
              if (!body.includes(section)) {
                failures.push(`Missing required PR template section: ${section}`);
              }
            }

            const issueRegex = /(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?|addresses|partially addresses)\s+#(\d+)/gi;
            const issueIds = [...body.matchAll(issueRegex)].map((m) => Number(m[1]));
            const uniqueIssueIds = [...new Set(issueIds)];

            if (uniqueIssueIds.length === 0) {
              failures.push("No linked issue found. Use keywords like: Closes #123");
            }

            const hasAcEvidence = /\|\s*AC-\d+/m.test(body);
            if (!hasAcEvidence) {
              failures.push("Missing AC evidence table rows (expected at least one '| AC-<n> | ...').");
            }

            for (const issueNumber of uniqueIssueIds) {
              try {
                const { data: issue } = await github.rest.issues.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                });
                const labels = (issue.labels || []).map((l) => (typeof l === "string" ? l : l.name));

                if (!labels.includes("quality:ready")) {
                  failures.push(`#${issueNumber} is not quality:ready.`);
                }
                if (labels.includes("quality:needs-spec")) {
                  failures.push(`#${issueNumber} still has quality:needs-spec.`);
                }
                if (!labels.some((l) => l && l.startsWith("scope:"))) {
                  failures.push(`#${issueNumber} has no scope:* label.`);
                }
              } catch (error) {
                failures.push(`Cannot load linked issue #${issueNumber}: ${error.message}`);
              }
            }

            if (failures.length > 0) {
              core.summary.addHeading("PR Quality Gate: FAILED");
              core.summary.addList(failures);
              await core.summary.write();
              core.setFailed(failures.join("\n"));
              return;
            }

            core.summary.addHeading("PR Quality Gate: PASSED");
            core.summary.addRaw("Linked issues and PR evidence requirements are satisfied.");
            await core.summary.write();

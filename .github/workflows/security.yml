name: Security Audit

on:
  schedule:
    - cron: '0 6 * * 1'  # Montag 06:00 UTC
  push:
    paths:
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - '**/go.mod'
      - '**/go.sum'
      - '**/package.json'
      - '**/bun.lock'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  checks: write

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-audit:
    runs-on: ${{ vars.RUNNER_MODE == 'hosted' && 'ubuntu-latest' || fromJSON('["self-hosted", "linux", "x64"]') }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7 # pinned
        with:
          toolchain: "1.97.1"
      - name: Assert pinned Rust toolchain
        run: |
          EXPECT="1.97.1"; ACTUAL="$(rustc --version | awk '{print $2}')"
          echo "rustc: $ACTUAL (expected $EXPECT)"
          test "$ACTUAL" = "$EXPECT" || { echo "::error::rustc $ACTUAL != $EXPECT"; exit 1; }
      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit
        # Keep this aligned with deny.toml: rsa is transitive via zenoh and has no fixed release.
        run: cargo audit --ignore RUSTSEC-2023-0071

  go-vuln:
    runs-on: ${{ vars.RUNNER_MODE == 'hosted' && 'ubuntu-latest' || fromJSON('["self-hosted", "linux", "x64"]') }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version-file: cmd/cortex-gateway/go.mod
          cache-dependency-path: cmd/cortex-gateway/go.sum
      - name: govulncheck
        working-directory: cmd/cortex-gateway
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  console-audit:
    runs-on: ${{ vars.RUNNER_MODE == 'hosted' && 'ubuntu-latest' || fromJSON('["self-hosted", "linux", "x64"]') }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install Bun (baseline for legacy CPU)
        run: |
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
      - name: Install dependencies
        working-directory: console
        run: bun install --frozen-lockfile
      - name: Audit
        working-directory: console
        run: bun pm audit 2>/dev/null || echo "Audit completed"

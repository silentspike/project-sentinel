name: Coverage

on:
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
  workflow_dispatch:

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  coverage:
    name: Code Coverage
    runs-on: ${{ vars.RUNNER_MODE == 'hosted' && 'ubuntu-latest' || fromJSON('["self-hosted", "linux", "x64"]') }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7 # stable
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
        with:
          cache-on-failure: true

      - name: Install cargo-tarpaulin
        uses: taiki-e/install-action@288875dd3d64326724fa6d9593062d9f8ba0b131 # v2.67.30
        with:
          tool: cargo-tarpaulin

      - name: Generate coverage
        # #599: --engine llvm (source-based coverage) instead of the default
        # ptrace engine. All test binaries report `test result: ok` (0 failed)
        # but the ptrace engine reports "Test failed during run" - a
        # post-harness abnormal exit that ptrace flags while the test harness
        # reports success. The llvm engine instruments at the source level
        # (-Cinstrument-coverage) and does not trace process exits the same
        # way; the `llvm-tools-preview` component is required for it.
        # Skips and tuning:
        # - --skip ac_10_02_bio_formulas: bio acceptance test flakes only
        #   under tarpaulin's instrumentation (passes locally + on cargo
        #   remote). Tracked in PROGRESS.md F-007.
        # - --skip wasm_e2e: end-to-end WASM tests boot a sandboxed
        #   wasmtime + plugin and exceed tarpaulin's per-test timeout. The
        #   same tests run green under `cargo test`. Tracked in F-009.
        # - --timeout 300 raises tarpaulin's per-test ceiling so the
        #   remaining slow-but-finite tests get headroom.
        run: |
          cargo tarpaulin --workspace --engine llvm --timeout 300 --out xml \
            --output-dir target/coverage \
            -- --skip ac_10_02_bio_formulas --skip wasm_e2e

      - name: Upload to Codecov
        uses: codecov/codecov-action@671740ac38dd9b0130fbe1cec585b89eea48d3de # v5.5.2
        with:
          files: target/coverage/cobertura.xml
          fail_ci_if_error: false

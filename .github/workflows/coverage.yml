name: Coverage

on:
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
  workflow_dispatch:

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  coverage:
    name: Code Coverage
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7 # stable

      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
        with:
          cache-on-failure: true

      - name: Install cargo-tarpaulin
        uses: taiki-e/install-action@288875dd3d64326724fa6d9593062d9f8ba0b131 # v2.67.30
        with:
          tool: cargo-tarpaulin

      - name: Generate coverage
        # ac_10_02_bio_formulas is skipped under tarpaulin only: the test
        # passes locally and on the remote build server but flakes under
        # tarpaulin's instrumentation due to f32 rounding drift in the
        # social-need accumulator. Tracked in PROGRESS.md F-007 — fix is to
        # rewrite the assertion to be epsilon-tolerant of accumulator drift.
        run: |
          cargo tarpaulin --workspace --out xml --output-dir target/coverage \
            -- --skip ac_10_02_bio_formulas

      - name: Upload to Codecov
        uses: codecov/codecov-action@671740ac38dd9b0130fbe1cec585b89eea48d3de # v5.5.2
        with:
          files: target/coverage/cobertura.xml
          fail_ci_if_error: false

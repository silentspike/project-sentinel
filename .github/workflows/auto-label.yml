name: Auto Label

on:
  issues:
    types: [opened]
  pull_request:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  label-issues:
    if: github.event_name == 'issues'
    runs-on: ${{ vars.RUNNER_MODE == 'hosted' && 'ubuntu-latest' || fromJSON('["self-hosted", "linux", "x64"]') }}
    steps:
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const title = context.payload.issue.title.toLowerCase();
            const labels = [];

            // Type detection from title prefix
            if (title.startsWith('[bug]') || title.includes('broken') || title.includes('crash'))
              labels.push('type:bug', 'prio:high', 'size:M', 'status:triage');
            else if (title.startsWith('[feature]') || title.startsWith('[feat]'))
              labels.push('type:feature', 'prio:medium', 'size:M', 'status:backlog');
            else if (title.startsWith('[epic]'))
              labels.push('type:epic', 'prio:medium', 'size:XL', 'status:backlog');
            else if (title.startsWith('[perf]'))
              labels.push('type:perf', 'prio:medium', 'size:M', 'status:backlog');
            else if (title.startsWith('[docs]'))
              labels.push('type:docs', 'prio:low', 'size:S', 'status:backlog');
            else
              labels.push('prio:medium', 'size:M', 'status:triage');

            // Component detection from body + title
            const body = (context.payload.issue.body || '').toLowerCase();
            const text = title + ' ' + body;

            // Scope detection from template body, fallback to full
            const scopeMatch = body.match(/scope:(full|experimental)/i);
            if (scopeMatch)
              labels.push(`scope:${scopeMatch[1].toLowerCase()}`);
            else
              labels.push('scope:full');

            // New issues are not ready by default until issue-quality gate promotes them
            labels.push('quality:needs-spec');

            if (text.includes('ecs') || text.includes('bevy') || text.includes('simulation'))
              labels.push('comp:ecs');
            if (text.includes('bio') || text.includes('hunger') || text.includes('caffein'))
              labels.push('comp:bio');
            if (text.includes('cortex') || text.includes('gateway') || text.includes('proxy'))
              labels.push('comp:cortex');
            if (text.includes('dashboard') || text.includes('frontend') || text.includes('websocket'))
              labels.push('comp:dashboard');
            if (
              text.includes('inference') ||
              text.includes('routing') ||
              text.includes('provider') ||
              text.includes('model swap') ||
              text.includes('llm')
            )
              labels.push('comp:inference');
            if (text.includes('sandbox') || text.includes('bwrap') || text.includes('cgroup'))
              labels.push('comp:sandbox');
            if (text.includes('controlplane') || text.includes('self-healing') || text.includes('platform'))
              labels.push('comp:daemon');
            if (text.includes('security') || text.includes('ransomware') || text.includes('landlock'))
              labels.push('type:security');
            if (text.includes('gaia') || text.includes('konfigurator') || text.includes('wizard'))
              labels.push('comp:runtime');
            if (text.includes('resource') || text.includes('scheduling') || text.includes('dynamic') && text.includes('limit'))
              labels.push('comp:sandbox');

            if (labels.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                labels: [...new Set(labels)]
              });
            }

  label-prs:
    if: github.event_name == 'pull_request'
    runs-on: ${{ vars.RUNNER_MODE == 'hosted' && 'ubuntu-latest' || fromJSON('["self-hosted", "linux", "x64"]') }}
    steps:
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const title = context.payload.pull_request.title;
            const labels = [];

            // Conventional Commits detection
            if (title.startsWith('feat'))  labels.push('type:feature');
            if (title.startsWith('fix'))   labels.push('type:bug');
            if (title.startsWith('perf'))  labels.push('type:perf');
            if (title.startsWith('docs'))  labels.push('type:docs');
            if (title.startsWith('ci'))    labels.push('type:ci');
            if (title.startsWith('deps') || title.startsWith('chore(deps)'))
              labels.push('type:deps');
            if (title.startsWith('refactor')) labels.push('type:refactor');

            // Dependabot detection
            if (context.payload.pull_request.user.login === 'dependabot[bot]')
              labels.push('type:deps');

            if (labels.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                labels: [...new Set(labels)]
              });
            }

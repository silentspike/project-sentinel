name: Auto Label

on:
  issues:
    types: [opened]
  pull_request:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  label-issues:
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.issue.title.toLowerCase();
            const labels = [];

            // Type detection from title prefix
            if (title.startsWith('[bug]') || title.includes('broken') || title.includes('crash'))
              labels.push('type:bug', 'prio:high', 'status:triage');
            else if (title.startsWith('[feature]') || title.startsWith('[feat]'))
              labels.push('type:feature', 'status:backlog');
            else if (title.startsWith('[perf]'))
              labels.push('type:perf', 'status:backlog');
            else if (title.startsWith('[docs]'))
              labels.push('type:docs', 'status:backlog');
            else
              labels.push('status:triage');

            // Component detection from body + title
            const body = (context.payload.issue.body || '').toLowerCase();
            const text = title + ' ' + body;

            if (text.includes('ecs') || text.includes('bevy') || text.includes('simulation'))
              labels.push('comp:ecs');
            if (text.includes('bio') || text.includes('hunger') || text.includes('caffein'))
              labels.push('comp:bio');
            if (text.includes('cortex') || text.includes('gateway') || text.includes('proxy'))
              labels.push('comp:cortex');
            if (text.includes('dashboard') || text.includes('frontend') || text.includes('websocket'))
              labels.push('comp:dashboard');
            if (text.includes('bitnet') || text.includes('inference') || text.includes('lora'))
              labels.push('comp:inference');
            if (text.includes('sandbox') || text.includes('bwrap') || text.includes('cgroup'))
              labels.push('comp:sandbox');

            if (labels.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                labels: [...new Set(labels)]
              });
            }

  label-prs:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.pull_request.title;
            const labels = [];

            // Conventional Commits detection
            if (title.startsWith('feat'))  labels.push('type:feature');
            if (title.startsWith('fix'))   labels.push('type:bug');
            if (title.startsWith('perf'))  labels.push('type:perf');
            if (title.startsWith('docs'))  labels.push('type:docs');
            if (title.startsWith('ci'))    labels.push('type:ci');
            if (title.startsWith('deps') || title.startsWith('chore(deps)'))
              labels.push('type:deps');
            if (title.startsWith('refactor')) labels.push('type:refactor');

            // Dependabot detection
            if (context.payload.pull_request.user.login === 'dependabot[bot]')
              labels.push('type:deps');

            if (labels.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                labels: [...new Set(labels)]
              });
            }

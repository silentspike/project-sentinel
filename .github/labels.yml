# Label Schema - Project Sentinel
# Sync via: .github/workflows/labels.yml (EndBug/label-sync)

# Type
- name: "type:epic"
  color: "3e4b9e"
  description: "Epic: groups related stories"
- name: "type:bug"
  color: "d73a4a"
  description: "Something is broken"
- name: "type:feature"
  color: "0075ca"
  description: "New functionality"
- name: "type:perf"
  color: "f9d0c4"
  description: "Performance improvement"
- name: "type:deps"
  color: "ededed"
  description: "Dependency update"
- name: "type:ci"
  color: "e6e6e6"
  description: "CI/CD changes"
- name: "type:docs"
  color: "0e8a16"
  description: "Documentation"
- name: "type:refactor"
  color: "d4c5f9"
  description: "Code restructuring"

# Status (Kanban Workflow: backlog → ready → in-progress → review → completed)
- name: "status:triage"
  color: "fbca04"
  description: "Needs triage"
- name: "status:backlog"
  color: "c5def5"
  description: "Accepted, not started"
- name: "status:ready"
  color: "0e8a16"
  description: "Ready for development, all deps fulfilled"
- name: "status:in-progress"
  color: "fbca04"
  description: "Currently being worked on"
- name: "status:review"
  color: "1d76db"
  description: "PR open, in review"
- name: "status:blocked"
  color: "b60205"
  description: "Blocked by dependency"
- name: "status:completed"
  color: "238636"
  description: "Work completed"
- name: "status:partial"
  color: "8b949e"
  description: "Partially delivered, follow-up issue required"

# Component
- name: "comp:ecs"
  color: "1d76db"
  description: "ECS / World Simulation"
- name: "comp:bio"
  color: "0e8a16"
  description: "Bio-Engine"
- name: "comp:cortex"
  color: "5319e7"
  description: "Cortex Gateway"
- name: "comp:dashboard"
  color: "006b75"
  description: "Dashboard UI"
- name: "comp:inference"
  color: "e99695"
  description: "Inference / LLM Routing"
- name: "comp:sandbox"
  color: "c2e0c6"
  description: "Agent Sandbox"

# Priority
- name: "prio:critical"
  color: "b60205"
  description: "Must fix immediately"
- name: "prio:high"
  color: "d93f0b"
  description: "Important"
- name: "prio:medium"
  color: "fbca04"
  description: "Medium priority"
- name: "prio:low"
  color: "c5def5"
  description: "Nice to have"

# Scope
- name: "scope:full"
  color: "1f6feb"
  description: "Full delivery expected"
- name: "scope:partial"
  color: "8250df"
  description: "Reduced scope delivery accepted"
- name: "scope:experimental"
  color: "db6d28"
  description: "Prototype/placeholder accepted"

# Issue Quality
- name: "quality:needs-spec"
  color: "b60205"
  description: "Specification incomplete, not ready"
- name: "quality:ready"
  color: "238636"
  description: "Spec + AC + verify complete"
- name: "quality:needs-evidence"
  color: "d29922"
  description: "Implementation present, evidence incomplete"

# Size (Story Points / Estimation)
- name: "size:S"
  color: "c5def5"
  description: "Small: < 1 day"
- name: "size:M"
  color: "bfdadc"
  description: "Medium: 1-3 days"
- name: "size:L"
  color: "f9d0c4"
  description: "Large: 3-5 days"
- name: "size:XL"
  color: "e99695"
  description: "Extra Large: > 5 days"

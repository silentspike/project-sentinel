# Sync with: gh label create "name" --color "hex" --description "desc"
# Or use: github/issue-labeler action

# Type
- name: "type:bug"
  color: "d73a4a"
  description: "Something is broken"
- name: "type:feature"
  color: "0075ca"
  description: "New functionality"
- name: "type:perf"
  color: "f9d0c4"
  description: "Performance improvement"
- name: "type:deps"
  color: "ededed"
  description: "Dependency update"
- name: "type:ci"
  color: "e6e6e6"
  description: "CI/CD changes"
- name: "type:docs"
  color: "0e8a16"
  description: "Documentation"
- name: "type:refactor"
  color: "d4c5f9"
  description: "Code restructuring"

# Status
- name: "status:triage"
  color: "fbca04"
  description: "Needs triage"
- name: "status:backlog"
  color: "c5def5"
  description: "Accepted, not started"
- name: "status:blocked"
  color: "b60205"
  description: "Blocked by dependency"

# Component
- name: "comp:ecs"
  color: "1d76db"
  description: "ECS / World Simulation"
- name: "comp:bio"
  color: "0e8a16"
  description: "Bio-Engine"
- name: "comp:cortex"
  color: "5319e7"
  description: "Cortex Gateway"
- name: "comp:dashboard"
  color: "006b75"
  description: "Dashboard UI"
- name: "comp:inference"
  color: "e99695"
  description: "BitNet / Inference"
- name: "comp:sandbox"
  color: "c2e0c6"
  description: "Agent Sandbox"

# Priority
- name: "prio:critical"
  color: "b60205"
  description: "Must fix immediately"
- name: "prio:high"
  color: "d93f0b"
  description: "Important"
- name: "prio:low"
  color: "c5def5"
  description: "Nice to have"

name: Feature Request
description: Suggest a new feature or improvement
labels: ["type:feature", "status:backlog"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How should it work?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - ECS / World Simulation
        - Bio-Engine
        - Cortex Gateway
        - Dashboard
        - Agent Runtime / Sandbox
        - BitNet / Inference
        - Zenoh / Messaging
        - Other

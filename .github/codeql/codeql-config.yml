name: "Sentinel CodeQL Config"

# Cluster-aware path scoping. The SolidJS console is intentionally INCLUDED
# so it gets full SAST coverage instead of the autobuild shortcut.
#
# Per Plan v4 §F4 / decision E17:
#   build-mode: none for JS/TS with explicit console typecheck in the workflow

paths:
  - "cmd"
  - "crates"
  - "services"
  - "pkg"
  - "console"
  - "scripts"

paths-ignore:
  - "target"
  - "crates/sentinel-wasm/tests/fixtures/*/target"
  - "docs"
  - "config"
  - "console/evidence"
  - "**/node_modules"
  - "**/.next"
  - "**/dist"
  - "**/build"

query-filters:
  # Bun/TSX noise — local-scope unused vars are a project style choice,
  # not a security signal. Filter out to keep JS/TS findings focused.
  - exclude:
      id: js/unused-local-variable

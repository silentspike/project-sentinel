version: 2

updates:
  # Rust
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels:
      - "type:deps"
    groups:
      rust-minor:
        update-types: [minor, patch]
    open-pull-requests-limit: 5

  # Go
  - package-ecosystem: gomod
    directory: /cmd/cortex-gateway
    schedule:
      interval: weekly
      day: monday
    labels:
      - "type:deps"
    groups:
      go-minor:
        update-types: [minor, patch]
    open-pull-requests-limit: 3

  # Bun / npm
  - package-ecosystem: npm
    directory: /dashboard
    schedule:
      interval: weekly
      day: monday
    labels:
      - "type:deps"
    groups:
      bun-minor:
        update-types: [minor, patch]
    open-pull-requests-limit: 3

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels:
      - "type:ci"
    open-pull-requests-limit: 3

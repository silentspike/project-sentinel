# Cortex Gateway Configuration
# Provider/model catalog values are immutable for the process lifetime.
# Environment variables may supply credentials and transport endpoints only.

[server]
proxy_port = 8080
control_port = 8081
read_timeout_seconds = 30
write_timeout_seconds = 60

[providers.claude-code]
type = "claude-code"
binary = "claude"
default_model = "claude-sonnet-5"
allowed_models = ["claude-opus-4-8", "claude-sonnet-5", "claude-haiku-4-5-20251001"]
priority = 2

[providers.claude-code.hierarchy_models]
tier_1 = "claude-opus-4-8"
tier_2 = "claude-sonnet-5"
tier_3 = "claude-haiku-4-5-20251001"

[providers.codex-cli]
type = "codex-cli"
binary = "/opt/sentinel/bin/codex"
default_model = "gpt-5.6-luna"
allowed_models = ["gpt-5.6-sol", "gpt-5.6-terra", "gpt-5.6-luna"]
priority = 1

[providers.codex-cli.hierarchy_models]
tier_1 = "gpt-5.6-sol"
tier_2 = "gpt-5.6-terra"
tier_3 = "gpt-5.6-luna"

[providers.anthropic-direct]
type = "anthropic-direct"
base_url = "https://api.anthropic.com"
default_model = "claude-sonnet-5"
allowed_models = ["claude-opus-4-8", "claude-sonnet-5", "claude-haiku-4-5-20251001"]
priority = 3

[providers.anthropic-direct.hierarchy_models]
tier_1 = "claude-opus-4-8"
tier_2 = "claude-sonnet-5"
tier_3 = "claude-haiku-4-5-20251001"

[providers.ollama]
type = "ollama"
base_url = "http://localhost:11434"
default_model = "qwen3:8b"
allowed_models = ["qwen3:14b", "qwen3:8b", "qwen3:4b-instruct"]
max_tokens = 4096
priority = 4

[providers.ollama.hierarchy_models]
tier_1 = "qwen3:14b"
tier_2 = "qwen3:8b"
tier_3 = "qwen3:4b-instruct"

[providers.local-loop]
type = "local-loop"
default_model = "local-loop-tier2"
allowed_models = ["local-loop-tier1", "local-loop-tier2", "local-loop-tier3"]
priority = 5

[providers.local-loop.hierarchy_models]
tier_1 = "local-loop-tier1"
tier_2 = "local-loop-tier2"
tier_3 = "local-loop-tier3"

[pipeline]
temperature = 0.7
enable_fourth_wall_detection = true
enable_perception_injection = true
enable_action_extraction = true

[compiler]
agent_config_dir = "config/agents"
enable_cache_ordering = true
enable_distillation = true
distillation_max_tokens = 2000

[guardrails]
# Enable via SENTINEL_GUARDRAILS_ENABLED=true env var
enabled = false
budget_hourly_tokens = 5000000   # 5M tokens/hour
budget_daily_tokens = 50000000   # 50M tokens/day
rate_limit_per_agent_rpm = 20    # 20 calls/min per agent
rate_limit_global_rpm = 300      # 300 calls/min global
burst_multiple = 2
fallback_provider = "ollama"

[guardrails.provider_prices.claude]
input_price_per_m_token = 3.0    # USD per 1M input tokens
output_price_per_m_token = 15.0  # USD per 1M output tokens

[guardrails.provider_prices.ollama]
input_price_per_m_token = 0.0
output_price_per_m_token = 0.0

[hardening]
# Pipeline Hardening (#144): Personality Guard, Quality Gate, Narrative Nudge
# These are loaded via environment variables (see systemd unit):
#   SENTINEL_PERSONALITY_GUARD_ENABLED=true
#   SENTINEL_DRIFT_THRESHOLD=0.7
#   SENTINEL_QUALITY_GATE_ENABLED=true
#   SENTINEL_QUALITY_THRESHOLD=2
#   SENTINEL_QUALITY_MAX_REGEN=1
#   SENTINEL_NARRATIVE_NUDGE=""
# All settings are also changeable at runtime via PATCH /control/config

[metrics]
enabled = true
path = "/metrics"

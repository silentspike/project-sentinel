# NATS server config for demo stack.

server_name: sentinel-demo
listen: 0.0.0.0:4222
http_port: 8222

jetstream {
  store_dir: /tmp/nats
  max_memory_store: 256MB
  # SENTINEL_EVENTS asks for 1 GB and SENTINEL_JUDGE for 100 MB; give
  # JetStream comfortable headroom above the sum so stream creation
  # succeeds (NATS rejects a stream whose MaxBytes exceeds remaining).
  max_file_store: 4GB
}

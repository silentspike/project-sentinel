[daemon]
config_dir = "/opt/sentinel/config"
data_dir = "/opt/sentinel/data"
tick_rate_ms = 1000
time_scale = 1.0
max_agents = 60
zenoh_prefix = "sentinel"
fs_mount = "/opt/sentinel/fs"

# PSI-basierte adaptive Tick-Rate (TOGAF Adaptive Scheduling)
[daemon.adaptive]
enabled = true
cpu_threshold = 85.0     # PSI avg10 % → Tick-Rate × 0.5
mem_threshold = 80.0     # PSI avg10 % → Agent-Spawn blockiert
io_threshold = 70.0      # PSI avg10 % → Batching 500ms
min_tick_rate_ms = 2000  # Floor: nie langsamer als 0.5 Hz
psi_sample_interval = 10 # Alle N Ticks PSI lesen

[daemon.zenoh]
shm_enabled = true
shm_buffer_size_bytes = 1048576    # 1 MB SHM ring buffer
fanout_channel_capacity = 256      # mpsc channel fuer ECS → Zenoh Fan-Out
query_responder_enabled = true     # Scoped Query Responder aktivieren
query_deadline_ms = 100            # Query Timeout
max_inflight_global = 128          # Gleichzeitige Queries global
max_inflight_per_agent = 8         # Gleichzeitige Queries pro Agent

[daemon.nats]
url = "nats://127.0.0.1:4222"

[daemon.operator_api]
enabled = true
bind_addr = "127.0.0.1:8084"

[daemon.traffic_control]
synthesis_enabled = true
sequencing_enabled = true
tick_sync_enabled = true
apicp_enabled = true
tick_sync_timeout_ms = 2000
p3_timeout_ms = 5000
gateway_request_timeout_ms = 150000
max_forward_concurrency = 3
intercept_mode = "auto"

# Time Machine: World Snapshots + Event Retention
[daemon.retention]
hourly_interval_ticks = 3600  # 1h bei 1s Tick-Rate
daily_keep_hours = 24         # Hourly Snapshots 24h behalten
weekly_keep_days = 7          # Daily Snapshots 7 Tage behalten
monthly_keep_weeks = 4        # Weekly Snapshots 4 Wochen behalten
event_retention_hours = 2     # Live-Events 2h behalten (1h Puffer nach Snapshot)
auto_prune = true             # Automatisches Pruning nach Snapshot

# Smart Resource Management: Dynamische cgroup-Limits pro Agent
[daemon.resource_manager]
enabled = true
check_interval_ticks = 30     # Profil-Check alle 30 Ticks (~30s)
idle_threshold_ticks = 300    # 300 Ticks ohne Aktivitaet = Idle (~5 Min)
max_heavy = 3                 # Max 3 Agents gleichzeitig Heavy
min_transition_cycles = 3     # 3 konsekutive Zyklen vor Profil-Wechsel (Hysterese)

# Platform-Controlplane: Self-Healing Background Service
[daemon.platform_controlplane]
enabled = true
cycle_interval_ticks = 60      # Regel-Evaluation alle 60 Ticks (~60s)
ebpf_collect_interval_ticks = 10  # eBPF Metrics-Snapshot alle 10 Ticks (~10s)
stall_detection_threshold_secs = 30  # eBPF write()-Inaktivitaet bis Stall
stall_recent_activity_grace_ticks = 120  # Frische Activity innerhalb dieses Fensters ist kein Stall
stall_cooldown_ticks = 60      # Cooldown pro gestalltem Agent
prune_cooldown_ticks = 3600    # Max 1 Prune pro Stunde
max_event_store_bytes = 524288000  # 500 MB Schwellwert
max_projection_lag = 10000     # Max Lag bevor Alert
memory_pressure_threshold = 0.9  # 90% cgroup Memory
max_escalation = 3             # Max Eskalationsstufen
write_anomaly_threshold_bytes_per_sec = 5000000  # 5 MB/s
write_anomaly_cooldown_ticks = 60
service_check_interval_secs = 60
llm_enabled = true
llm_analysis_interval_secs = 300
llm_retry_delay_secs = 60
llm_gateway_timeout_ms = 30000
llm_prompt_template = "platform-controlplane-default"
llm_max_context_events = 10
llm_max_failed_interventions = 3
llm_trigger_queue_capacity = 16
llm_analysis_channel_capacity = 16

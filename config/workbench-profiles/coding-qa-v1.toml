# Immutable v1 contract; replacement requires a new digest-bound request.
schema_version = 1
id = "coding-qa-v1"
runtime_key = "bwrap-landlock"
network = "deny"
environment = { HOME = "/workspace", LANG = "C.UTF-8", LC_ALL = "C.UTF-8", PATH = "/usr/bin:/bin" }
capabilities = ["file.inspect", "test.run_profile"]
output_artifact_kinds = ["qa_evidence"]

[resource_ceilings]
wall_time_ms = 30000
cpu_time_ms = 10000
memory_bytes = 134217728
# Includes evaluator, nested namespaces and the Node test worker's OS threads.
process_count = 32
file_bytes = 8388608
stdout_bytes = 65536
stderr_bytes = 65536

[[command_rules]]
program = "sentinel-coding-qa"
required_arg_prefix = []
max_args = 65

# Compatibility inventory gate only; it does not prove native coding quality.
[[command_rules]]
program = "sentinel-coding-qa"
required_arg_prefix = ["--inventory-only"]
max_args = 65

[[test_suites]]
id = "python-qa-v1"
program = "sentinel-coding-qa"
required_arg_prefix = ["python-project-v1"]
max_args = 65

[[test_suites]]
id = "node-qa-v1"
program = "sentinel-coding-qa"
required_arg_prefix = ["node-project-v1"]
max_args = 65

[[test_suites]]
id = "web-work-item-qa-v1"
program = "sentinel-coding-qa"
required_arg_prefix = ["--inventory-only"]
max_args = 65

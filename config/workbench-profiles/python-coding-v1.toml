schema_version = 1
id = "python-coding-v1"
runtime_key = "bwrap-landlock"
network = "deny"
environment = { HOME = "/workspace", LANG = "C.UTF-8", LC_ALL = "C.UTF-8", PATH = "/usr/bin:/bin" }
capabilities = [
  "artifact.commit",
  "command.run_allowlisted",
  "file.inspect",
  "file.write",
  "observation.retain_private",
  "patch.apply",
  "test.run_profile",
]
output_artifact_kinds = ["source_tree"]

[resource_ceilings]
wall_time_ms = 30000
cpu_time_ms = 10000
memory_bytes = 134217728
process_count = 16
file_bytes = 8388608
stdout_bytes = 65536
stderr_bytes = 65536

[[command_rules]]
program = "python3"
required_arg_prefix = ["-E", "-s", "--"]
max_args = 32

[[command_rules]]
program = "python3"
required_arg_prefix = ["-I", "-m", "unittest", "discover"]
max_args = 4

[[command_rules]]
program = "python3"
required_arg_prefix = ["-I", "-m", "unittest", "discover", "-s"]
max_args = 6

[[test_suites]]
id = "python-unittest"
program = "python3"
required_arg_prefix = ["-I", "-m", "unittest", "discover"]
max_args = 4

[[test_suites]]
id = "python-unittest-directory"
program = "python3"
required_arg_prefix = ["-I", "-m", "unittest", "discover", "-s"]
max_args = 6

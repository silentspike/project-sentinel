# NATS Server Configuration for Project Sentinel
# Deploy: /etc/nats/nats.conf on 10.0.0.240

server_name: sentinel-nats
host: 127.0.0.1
port: 4222
http_port: 8222

max_payload: 1048576

jetstream {
  store_dir: /var/lib/nats
  max_memory_store: 536870912
  max_file_store:   2147483648
}

logtime: true
debug: false
